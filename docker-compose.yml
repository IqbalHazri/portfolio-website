services:
  # Production
  web:
    build: .
    ports:
      - "8080:80"

  # Development
  dev:
    image: node:20-alpine
    container_name: my-portfolio-dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules: